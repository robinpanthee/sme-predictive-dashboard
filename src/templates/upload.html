<!DOCTYPE html>
<html>
<head>
    <title>SME Predictive Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 50px auto; padding: 20px; }
        h1 { color: #2c3e50; }
        .box { border: 2px solid #3498db; padding: 25px; border-radius: 8px; }
        input[type=file] { margin: 15px 0; }
        button { background: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <h1>SME Predictive Dashboard</h1>
    <p>Upload your sales CSV file to get demand forecast and anomaly score.</p>
    <p> MSIT 5910-01 MSIT Capstone Project - AY2027-T1</p>
    
    <div class="box">
        <form action="/upload" method="post" enctype="multipart/form-data">
            <label><strong>Select CSV File:</strong></label><br>
            <input type="file" name="file" accept=".csv" required>
            <br><br>
            <button type="submit">Upload and Analyze</button>
        </form>
    </div>
</body>
</html>
